name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: v + versionName from app/build.gradle.kts)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text()
          print(re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          CODE=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text()
          print(re.search(r'versionCode\s*=\s*(\d+)', text).group(1))
          PY
          )
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${NAME}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Unit tests + assemble APKs
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease
          ./tools/copy-apks.sh all

      - name: Write OTA version.json
        run: |
          chmod +x ./tools/release/write-release-meta.sh
          ./tools/release/write-release-meta.sh releases/beauty-mirror-debug.apk releases

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="Beauty Mirror ${{ steps.ver.outputs.name }}"
          ASSETS=(releases/beauty-mirror-debug.apk releases/version.json)
          if [[ -f releases/beauty-mirror-release.apk ]]; then
            ASSETS+=(releases/beauty-mirror-release.apk)
          elif [[ -f releases/beauty-mirror-release-unsigned.apk ]]; then
            ASSETS+=(releases/beauty-mirror-release-unsigned.apk)
          fi
          NOTES_ARGS=(--generate-notes)
          [[ -f RELEASE_NOTES_3.1.0.md ]] && NOTES_ARGS=(--notes-file RELEASE_NOTES_3.1.0.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TITLE" "${NOTES_ARGS[@]}"
          fi
          gh release view "$TAG" --json url -q .url
